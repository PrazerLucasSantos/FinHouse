<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinHouse</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6fb;color:#0f172a;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.08);max-width:520px}small{color:#64748b}
</style>
</head>
<body>
<div class="card" id="status"><strong>Carregando FinHouse…</strong><br><small>Preparando o sistema financeiro.</small></div>
<script>
(async()=>{
  try{
    const parts=await Promise.all(Array.from({length:6},(_,i)=>fetch(`payload/part-${String(i).padStart(2,'0')}.b64`).then(r=>{if(!r.ok)throw new Error(`Falha ao carregar parte ${i+1}`);return r.text()})));
    const b64=parts.join('').replace(/\s+/g,'');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(typeof DecompressionStream!=='function')throw new Error('Seu navegador não suporta DecompressionStream. Use Chrome, Edge, Firefox ou Safari atual.');
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bytes]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(err){
    document.getElementById('status').innerHTML='<strong>Não foi possível iniciar o FinHouse.</strong><br><small>'+String(err.message||err)+'</small>';
    console.error(err);
  }
})();
</script>
</body>
</html>
